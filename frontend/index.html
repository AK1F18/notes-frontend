<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Serverless Notes App</title>
  <script src="config.js"></script>
  <script defer src="script.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 2rem auto;
      max-width: 600px;
      background-color: #f9f9f9;
      color: #333;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }

    textarea {
      width: 100%;
      height: 100px;
      font-size: 1rem;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: none;
      margin-bottom: 1rem;
    }

    button {
      background-color: #0077cc;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #005fa3;
    }

    ul {
      padding-left: 0;
    }

    li.note-item {
      list-style: none;
      margin: 1rem 0;
      padding: 0.75rem 1rem;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .note-text {
      word-break: break-word;
      max-width: 80%;
    }

    .delete-button {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .delete-button:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>
  <h1>📝 Serverless Notes</h1>

  <textarea id="noteInput" placeholder="Write your note here..."></textarea><br>
  <button onclick="addNote()">Add Note</button>

  <h2 style="margin-top: 2rem;">📄 All Notes</h2>
  <ul id="notesList"></ul>
</body>
</html>
